# Solia — Docker Compose: the whole system with one command.
#
#   cp .env.example .env && docker compose up -d --build
#
# Requires Docker Engine 25+ (healthcheck start_interval) and Docker Compose 2.24+.
#
# Startup order (depends_on conditions):
#   postgres (healthy) → db-migrate (exited 0) → data-pipeline + ai-service (healthy)
#   ai-service (healthy) → backend (healthy) → dashboard
# The backend reads the DB and ai-service only: a failing data-pipeline doesn't keep 8080/8081 down.
#
# Only backend:8080 and dashboard:8081 are published on the host; postgres, data-pipeline and
# ai-service are reachable on the internal `solia` network only. Local dev (`dotnet run` against the
# containerized Postgres) publishes 5432 through the dev override:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres
#
# Config comes from .env (.env.example keys) by compose **interpolation**: each service lists exactly
# the variables it reads, so a key reaches only the containers that need it (SOLIA_MASTER_KEY: backend
# only). A .env key that isn't listed below reaches no container. Compose reads .env from the project
# directory; host env vars win over it. Every `${VAR:-default}` has a default, so the stack also starts
# without a .env (CI).
# Anything else for ONE service (nested .NET keys such as Logging__LogLevel__Default or Bot__*, ...)
# goes in the optional, gitignored config/<service>.env, loaded by that service only (env_file,
# required: false). The pinned values below win over it.
# Values that must point at the other containers (service hosts, in-container ports and paths) are
# pinned below, so a .env written for local `dotnet run` (POSTGRES_HOST=localhost, SOLIA_DB_CONNECTION=
# Host=localhost;…) can't misroute the containers, and every container runs as Production.
# Healthcheck commands come from each image's HEALTHCHECK (infra/docker); compose only tunes their timing.

# Credentials (from .env), shared by the postgres server and its clients: one copy, so they can't drift.
x-postgres-credentials: &postgres-credentials
  POSTGRES_USER: ${POSTGRES_USER:-solia}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
  POSTGRES_DB: ${POSTGRES_DB:-solia}

x-postgres-env: &postgres-env
  <<: *postgres-credentials
  # SOLIA_DB_CONNECTION wins over POSTGRES_*: blanked (empty = unset) so the compose host is used even
  # if an image or override sets one.
  SOLIA_DB_CONNECTION: ""
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  # Containers always run as Production (the image default), whatever .env says.
  ASPNETCORE_ENVIRONMENT: Production

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      <<: *postgres-credentials
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: the first-boot init server listens on the unix socket only, so it can't pass as ready.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s
    networks: [solia]

  # One-shot job: applies services/db/migrations (baked into the image) then exits. Re-running is a no-op.
  db-migrate:
    build:
      context: .
      dockerfile: infra/docker/db-migrator.Dockerfile
    environment:
      <<: *postgres-env
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [solia]

  data-pipeline:
    build:
      context: .
      dockerfile: infra/docker/data-pipeline.Dockerfile
    env_file:
      - path: config/data-pipeline.env
        required: false
    environment:
      <<: *postgres-env
      PUMPAPI_WS_URL: ${PUMPAPI_WS_URL:-wss://stream.pumpapi.io/}
      PUMPAPI_REPLAY_BASE_URL: ${PUMPAPI_REPLAY_BASE_URL:-https://replay.pumpapi.io}
      ENRICH_HOLDERS: ${ENRICH_HOLDERS:-false}
      # The pipeline's job in the stack is to ingest; set INGEST=false in .env to run it idle.
      INGEST: ${INGEST:-true}
      STREAM_PROBE: ${STREAM_PROBE:-false}
      # Data retention (docs/DATA-PIPELINE.md): the pipeline is the only service that purges.
      RETENTION_ENABLED: ${RETENTION_ENABLED:-true}
      RETENTION_INTERVAL_MINUTES: ${RETENTION_INTERVAL_MINUTES:-60}
      RETENTION_FEATURES_TTL_DAYS: ${RETENTION_FEATURES_TTL_DAYS:-14}
      RETENTION_LOGS_TTL_DAYS: ${RETENTION_LOGS_TTL_DAYS:-14}
      RETENTION_PREDICTIONS_TTL_DAYS: ${RETENTION_PREDICTIONS_TTL_DAYS:-30}
      RETENTION_BATCH_SIZE: ${RETENTION_BATCH_SIZE:-10000}
      RETENTION_ESTABLISHED_AGE_HOURS: ${RETENTION_ESTABLISHED_AGE_HOURS:-6}
      RETENTION_ESTABLISHED_TTL_DAYS: ${RETENTION_ESTABLISHED_TTL_DAYS:-90}
      RETENTION_ESTABLISHED_FULL_RESOLUTION_MINUTES: ${RETENTION_ESTABLISHED_FULL_RESOLUTION_MINUTES:-60}
      RETENTION_ESTABLISHED_SAMPLE_SECONDS: ${RETENTION_ESTABLISHED_SAMPLE_SECONDS:-60}
    volumes:
      # Opt-in local mirror of the replay archives (~400 MB/hour): only written by
      # `replay … --mirror /replay-archives`; live ingestion never touches it. See docs/DATA-PIPELINE.md.
      - replay-archives:/replay-archives
    restart: unless-stopped
    healthcheck:
      # /health needs the database; a dropped pumpapi stream is Degraded, not unhealthy.
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 3s
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks: [solia]

  ai-service:
    build:
      context: .
      dockerfile: infra/docker/ai-service.Dockerfile
    env_file:
      - path: config/ai-service.env
        required: false
    environment:
      <<: *postgres-env
      MODEL_DIR: /app/models
      # Closed trades between retrains (solia_ai.retrain); same value as the backend's.
      RETRAIN_EVERY_N_TRADES: ${RETRAIN_EVERY_N_TRADES:-500}
      # Background retrain trigger (solia_ai.retrain_service): on by default here, off-able.
      RETRAIN_SCHEDULER_ENABLED: ${RETRAIN_SCHEDULER_ENABLED:-true}
      RETRAIN_CHECK_INTERVAL_SECONDS: ${RETRAIN_CHECK_INTERVAL_SECONDS:-300}
      # Empty = the packaged config.yaml. Point it at a file in the models volume (/app/models/...).
      SOLIA_AI_CONFIG: ${SOLIA_AI_CONFIG:-}
    restart: unless-stopped
    healthcheck:
      # Cold start imports torch: a longer grace period than the .NET services.
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 3s
    volumes:
      - models:/app/models
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks: [solia]

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    env_file:
      - path: config/backend.env
        required: false
    environment:
      <<: *postgres-env
      AI_SERVICE_URL: http://ai-service:8000
      RETRAIN_EVERY_N_TRADES: ${RETRAIN_EVERY_N_TRADES:-500}
      PAPER_BOT_ENABLED: ${PAPER_BOT_ENABLED:-false}
      PAPER_STARTING_BALANCE: ${PAPER_STARTING_BALANCE:-10}
      PAPER_MAX_CONCURRENT_POSITIONS: ${PAPER_MAX_CONCURRENT_POSITIONS:-5}
      # The only container that gets the master key (docs/SECRETS.md). Empty = unset: fine without a
      # secrets.enc, fail fast with one. SOLIA_SECRETS_FILE isn't passed: the file is the default path,
      # i.e. the read-only mount below.
      SOLIA_MASTER_KEY: ${SOLIA_MASTER_KEY:-}
    restart: unless-stopped
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 3s
    ports:
      - "8080:8080"
    volumes:
      # secrets.enc only (docs/SECRETS.md), read from the default path /app/secrets/secrets.enc. The
      # backend runs as UID 1654: secrets.enc must be readable by it (e.g. chmod 644). No secrets.enc ⇒
      # plaintext config; a secrets.enc with a missing/wrong key ⇒ the backend exits non-zero.
      - ./secrets:/app/secrets:ro
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      ai-service:
        condition: service_healthy
    networks: [solia]

  dashboard:
    build:
      context: .
      dockerfile: infra/docker/dashboard.Dockerfile
    env_file:
      - path: config/dashboard.env
        required: false
    environment:
      # Containers always run as Production (the image default), whatever .env says: no developer exception page.
      ASPNETCORE_ENVIRONMENT: Production
      BACKEND_URL: http://backend:8080
    restart: unless-stopped
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 3s
    ports:
      - "8081:8081"
    depends_on:
      backend:
        condition: service_healthy
    networks: [solia]

networks:
  solia:
    driver: bridge

volumes:
  pgdata:
  models:
  replay-archives:
