name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Every step must pass: lint, format and test failures fail the build.
      # pytest also fails when it collects no tests (tests are mandatory, see CLAUDE.md).
      # The tools run from the service directory so they read its pyproject.toml settings
      # (line length 100, pytest testpaths) instead of their defaults.
      - name: Install
        working-directory: services/ai-service
        run: |
          python -m pip install --upgrade pip
          # Pinned runtime + dev tools from pyproject.toml; the CPU index avoids multi-GB CUDA wheels.
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev]"
      - name: Lint (ruff)
        working-directory: services/ai-service
        run: ruff check .
      - name: Format (black)
        working-directory: services/ai-service
        run: black --check .
      - name: Test (pytest)
        working-directory: services/ai-service
        run: pytest

  dotnet:
    name: .NET build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Detect .NET projects
        id: detect
        run: |
          if find services -name '*.csproj' -o -name '*.sln' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No .NET projects yet — skipping."
          fi
      - name: Restore
        if: steps.detect.outputs.found == 'true'
        run: dotnet restore
      - name: Format (dotnet format)
        if: steps.detect.outputs.found == 'true'
        run: dotnet format --no-restore --verify-no-changes
      - name: Build
        if: steps.detect.outputs.found == 'true'
        run: dotnet build --no-restore -c Release
      - name: Test
        if: steps.detect.outputs.found == 'true'
        run: dotnet test --no-build -c Release
