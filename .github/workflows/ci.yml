name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Every step must pass: lint, format and test failures fail the build.
      # pytest also fails when it collects no tests (tests are mandatory, see CLAUDE.md).
      # The tools run from the service directory so they read its pyproject.toml settings
      # (line length 100, pytest testpaths) instead of their defaults.
      - name: Install
        working-directory: services/ai-service
        run: |
          python -m pip install --upgrade pip
          # Pinned runtime + dev tools from pyproject.toml; the CPU index avoids multi-GB CUDA wheels.
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev]"
      - name: Lint (ruff)
        working-directory: services/ai-service
        run: ruff check .
      - name: Format (black)
        working-directory: services/ai-service
        run: black --check .
      - name: Test (pytest)
        working-directory: services/ai-service
        run: pytest

  dotnet:
    name: .NET build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Detect .NET projects
        id: detect
        run: |
          if find services -name '*.csproj' -o -name '*.sln' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No .NET projects yet — skipping."
          fi
      - name: Restore
        if: steps.detect.outputs.found == 'true'
        run: dotnet restore
      - name: Format (dotnet format)
        if: steps.detect.outputs.found == 'true'
        run: dotnet format --no-restore --verify-no-changes
      - name: Build
        if: steps.detect.outputs.found == 'true'
        run: dotnet build --no-restore -c Release
      - name: Test
        if: steps.detect.outputs.found == 'true'
        run: dotnet test --no-build -c Release

  # Builds every service image on each PR (never pushed) and checks it runs non-root.
  # T2–T5 add their image as one more `include` entry.
  docker:
    name: Docker image (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: data-pipeline
            dockerfile: infra/docker/data-pipeline.Dockerfile
            # Probe the image's HEALTHCHECK against a real Postgres.
            healthcheck: true
          - service: ai-service
            dockerfile: infra/docker/ai-service.Dockerfile
            # /health needs neither the database nor a champion model: healthy from a cold start.
            healthcheck: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Layers (incl. the ai-service torch layer) are cached in the GitHub Actions cache, one
      # scope per service; the image is loaded into the local daemon for the checks below.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: solia-${{ matrix.service }}:ci
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Assert non-root
        run: |
          uid=$(docker run --rm --entrypoint id solia-${{ matrix.service }}:ci -u)
          echo "uid=$uid"
          if [ "$uid" = "0" ]; then
            echo "::error::solia-${{ matrix.service }} runs as root"
            exit 1
          fi
      - name: Assert image contents (ai-service)
        if: matrix.service == 'ai-service'
        run: |
          docker run --rm --entrypoint python solia-ai-service:ci -c '
          import importlib.util, os, pathlib, tempfile, torch
          from importlib import resources
          assert torch.version.cuda is None, f"CUDA torch build: {torch.version.cuda}"
          assert resources.files("solia_ai").joinpath("config.yaml").is_file(), "config.yaml missing"
          model_dir = os.environ["MODEL_DIR"]
          assert model_dir == "/app/models", model_dir
          tempfile.NamedTemporaryFile(dir=model_dir).close()  # writable by the non-root user
          dev = [m for m in ("pytest", "ruff", "black", "testcontainers", "httpx") if importlib.util.find_spec(m)]
          assert not dev, f"dev dependencies in the image: {dev}"
          # The build stage stages sources in /src; only /opt/venv is copied over, and /app holds
          # nothing but the (empty) models directory.
          assert not pathlib.Path("/src").exists(), "build-stage sources leaked into the image"
          extra = sorted(p.name for p in pathlib.Path("/app").iterdir() if p.name != "models")
          assert not extra, f"unexpected entries in /app: {extra}"
          site = pathlib.Path(resources.files("solia_ai")).parent
          leaked = [str(p) for p in (site / "tests", site / "solia_ai" / "tests") if p.exists()]
          leaked += [str(p) for root in ("/app", "/opt/venv") for p in pathlib.Path(root).rglob(".env")]
          assert not leaked, f"tests or secrets in the image: {leaked}"
          print("ok: torch", torch.__version__)
          '
          docker image ls solia-ai-service:ci --format 'image size: {{.Size}}'
      - name: Assert healthy (with Postgres)
        if: matrix.healthcheck
        run: |
          docker network create solia-ci
          docker run -d --name postgres --network solia-ci \
            -e POSTGRES_USER=solia -e POSTGRES_PASSWORD=change_me -e POSTGRES_DB=solia postgres:16-alpine
          docker run -d --name app --network solia-ci -e POSTGRES_HOST=postgres solia-${{ matrix.service }}:ci
          status=starting
          for _ in $(seq 1 30); do
            state=$(docker inspect -f '{{.State.Status}}' app)
            status=$(docker inspect -f '{{.State.Health.Status}}' app)
            echo "state=$state health=$status"
            [ "$status" = "healthy" ] && exit 0
            # Fail fast: an unhealthy or exited container won't recover by waiting.
            if [ "$status" = "unhealthy" ] || [ "$state" != "running" ]; then break; fi
            sleep 5
          done
          echo "::error::solia-${{ matrix.service }} did not become healthy (state=$state health=$status)"
          docker inspect -f '{{json .State.Health}}' app
          docker logs app
          exit 1
