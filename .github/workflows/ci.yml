name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Detect Python projects
        id: detect
        run: |
          if ls services/*/pyproject.toml services/*/requirements.txt >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No Python projects yet — skipping."
          fi
      # Every step must pass: lint, format and test failures fail the build.
      # pytest also fails when it collects no tests (tests are mandatory, see CLAUDE.md).
      - name: Install
        if: steps.detect.outputs.found == 'true'
        run: |
          python -m pip install --upgrade pip ruff black pytest
          # ai-service is the only Python project (data-pipeline is a .NET worker).
          for d in services/ai-service; do
            if [ -f "$d/requirements.txt" ]; then pip install -r "$d/requirements.txt"; fi
            if [ -f "$d/pyproject.toml" ]; then pip install -e "$d"; fi
          done
      - name: Lint (ruff)
        if: steps.detect.outputs.found == 'true'
        run: ruff check services
      - name: Format (black)
        if: steps.detect.outputs.found == 'true'
        run: black --check services
      - name: Test (pytest)
        if: steps.detect.outputs.found == 'true'
        run: pytest services

  dotnet:
    name: .NET build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Detect .NET projects
        id: detect
        run: |
          if find services -name '*.csproj' -o -name '*.sln' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No .NET projects yet — skipping."
          fi
      - name: Restore
        if: steps.detect.outputs.found == 'true'
        run: dotnet restore
      - name: Format (dotnet format)
        if: steps.detect.outputs.found == 'true'
        run: dotnet format --no-restore --verify-no-changes
      - name: Build
        if: steps.detect.outputs.found == 'true'
        run: dotnet build --no-restore -c Release
      - name: Test
        if: steps.detect.outputs.found == 'true'
        run: dotnet test --no-build -c Release
