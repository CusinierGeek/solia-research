# Solia — NVIDIA GPU override: the ai-service is built with CUDA torch and given the host's GPUs, so
# training (initial and every automatic retrain) runs on CUDA.
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#
# Or make it the default for every compose command (incl. infra/scripts/solia.sh) in .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.gpu.yml
#   COMPOSE_PATH_SEPARATOR=:
#
# Requires an NVIDIA driver with CUDA 13.0 support on the host and Docker's NVIDIA runtime (Docker
# Desktop on Windows: WSL 2 backend, included). Check with:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml run --rm --no-deps ai-service \
#     python -c "import torch; print(torch.cuda.is_available(), torch.cuda.get_device_name(0))"
# The image is ~7.5 GB bigger than the CPU one (CUDA runtime wheels), and tagged separately so the two
# don't overwrite each other.

services:
  ai-service:
    image: solia-ai-service-cu130
    build:
      args:
        TORCH_VARIANT: cu130
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
