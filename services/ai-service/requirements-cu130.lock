# GPU image lock (TORCH_VARIANT=cu130, docker-compose.gpu.yml): the same packages and versions as
# requirements.lock, except torch as its +cu130 build plus the CUDA runtime wheels it pulls in.
# tests/test_requirements_lock.py keeps both locks in sync. Regenerate after requirements.lock,
# constrained on it so every shared package keeps its version (from this folder, bash):
#   grep -v -E '^#|^torch==' requirements.lock > /tmp/cpu-constraints.txt
#   uv pip compile pyproject.toml --python-version 3.11 --python-platform x86_64-manylinux_2_28 \
#     --default-index https://pypi.org/simple --index https://download.pytorch.org/whl/cu130 \
#     --index-strategy unsafe-best-match --constraint /tmp/cpu-constraints.txt \
#     --no-annotate --no-header -o requirements-cu130.lock
