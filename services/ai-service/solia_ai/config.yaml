# Solia AI — single source of model/training knobs (see docs/ML-MODEL.md).
# The database connection is NOT stored here; it comes from the environment
# (SOLIA_DB_CONNECTION, else POSTGRES_* — see solia_ai/config.py and .env.example).
# Override the file with SOLIA_AI_CONFIG=/path/to/config.yaml; it is validated on load.

model:
  d_model: 128
  n_heads: 8
  n_layers: 4
  ff_dim: 512 # encoder feed-forward width (4 * d_model)
  dropout: 0.1
  seq_len: 64 # longest history the model attends over (most recent rows)
  min_seq_len: 8 # shortest history a window may have: young tokens get padded, masked windows

training:
  learning_rate: 0.0003
  weight_decay: 0.01
  epochs: 50
  batch_size: 256
  warmup_steps: 500
  grad_clip: 1.0
  early_stopping_patience: 8
  seed: 42
  # Class imbalance is corrected once: balanced batches (events ~50%) by default; when false,
  # batches follow the natural distribution and the BCE term gets pos_weight = neg/pos instead.
  balanced_sampling: true
  # DataLoader: batches are gathered by `num_workers` worker processes while the model trains
  # (0 = in the training process). `auto` = half the CPUs (at most 4) where workers fork and so
  # share the dataset's rows (Linux, the container); 0 elsewhere, where each worker would copy
  # them. Results are identical whatever the count. 0: batches are gathered whole and cost far
  # less than the model step, so workers measured no faster (docs/ML-MODEL.md "Training
  # throughput"). `pin_memory: auto` = on for CUDA.
  num_workers: 0
  pin_memory: auto
  prefetch_factor: 2

loss:
  alpha: 0.5 # pump/rug loss = alpha * BCE + (1 - alpha) * Focal(gamma)  (docs/ML-MODEL.md)
  focal_gamma: 2.0
  strategy_weight: 1.0 # weight of the pump + rug classification terms
  regression_weight: 1.0 # weight of the expected_return term (Huber)
  # Optional per-horizon weights (default 1.0 each); unlisted horizons keep 1.0.
  # horizon_weights:
  #   "1h": 1.5
  # Class weighting of the BCE term (positive class). Only with training.balanced_sampling: false
  # (balanced batches already correct the imbalance; the two are rejected together).
  #   auto            neg/pos per horizon, measured on the training split (the default then)
  #   none            no weighting
  #   3.0             one weight for both heads
  #   {pump: 5.0, rug: 2.0}   per head (an omitted head keeps 1.0)
  # pos_weight: auto

# Post-hoc probability calibration per head x horizon (solia_ai/calibration.py), fit after training
# on the earliest `fraction` of the validation windows; `evaluate` only scores windows after them.
calibration:
  method: platt # platt (temperature + bias) | temperature | none
  fraction: 0.5
  min_samples: 50 # fewer labeled samples on a head/horizon keeps the identity
  min_class_samples: 10 # ... as does a minority class (events or non-events) smaller than this

# Feature groups the model sees (solia_ai/features.py FEATURE_GROUPS); the columns of every other
# group are zeroed. Omitted = the baseline (BASELINE_GROUPS). A candidate group is enabled only once
# its ablation lift clears the margin (docs/ML-MODEL.md "Ablation"), e.g.:
# features:
#   groups: [price, liquidity, flow, holders, context, buy_pressure, momentum, concentration, burn, venue]

# Promotion gate (solia_ai/promotion.py, docs/ML-MODEL.md "Promotion gate"): candidate vs champion
# on the same rolling held-out windows x seeds. Promote only when the primary predictive metric
# beats the champion by `margin` on average AND on at least `min_win_share` of the paired runs,
# with no ECE / secondary-metric regression beyond tolerance. Reference-policy P&L is a sanity
# check only: reported with a bootstrap CI, it can veto (`pnl_veto`) but never promote.
promotion:
  metric: pr_auc # roc_auc | pr_auc
  head: pump # pump | rug
  horizon: "5m" # one of `horizons`
  margin: 0.01 # minimum lift of the primary metric (candidate - champion)
  windows: 3 # rolling walk-forward held-out windows (solia_ai.ablation.walk_forward_windows)
  seeds: 3 # training seeds per window: runs = windows x seeds
  min_win_share: 0.6667 # share of runs whose lift must clear the margin (2/3: 6 of 9 runs pass)
  ece_tolerance: 0.01 # max ECE increase on any head/horizon (mean over runs)
  secondary_tolerance: 0.02 # max ROC-AUC / PR-AUC drop on any other head/horizon
  pnl_veto: true # reject when the P&L lift CI lies entirely below zero
  bootstrap_samples: 2000
  confidence: 0.95 # bootstrap CI level
  seed: 0 # bootstrap RNG seed (reproducible decisions)

# Candidate training (solia_ai/candidate.py): each retrain fits a candidate on every labeled window
# ending before the held-out window (the most recent `heldout_fraction`, minus the label embargo),
# never registering it. Warm start begins from the champion's weights (fresh optimizer/scheduler,
# `warm_start_epochs` budget); a champion whose spec (feature columns, enabled groups, horizons,
# model dims) differs from this config, or whose training data reaches into the held-out window,
# falls back to scratch (logged + recorded) or errors.
candidate:
  warm_start: true # false = always train from scratch (e.g. after a feature-spec change)
  warm_start_epochs: 10 # epoch budget of a warm start (scratch keeps training.epochs)
  warm_start_lr_factor: 0.1 # warm-start peak LR = training.learning_rate x this (don't re-heat)
  on_incompatible: scratch # scratch | error
  # heldout_fraction: most recent share of labeled windows the candidate never sees. Omitted on
  # purpose: it defaults to the walk-forward eval share the promotion gate scores (0.3).
  val_fraction: 0.2 # early-stopping/calibration split of the training range
  min_train_samples: 1000 # fewer training windows is an error, not a candidate

# Checkpoint retention (solia_ai/retention.py): after each retrain (and `python -m solia_ai.retrain
# prune`), checkpoint files in MODEL_DIR are deleted except the champion's, those of the previous
# champions a rollback walks back to, and the newest candidates. A pruned model keeps its `models`
# row (pruned_at set), so its history stays and a rollback to it is refused.
retention:
  keep_candidates: 5 # newest registered models kept besides the champion (0 = none)
  rollback_depth: 2 # previous champions kept for rollback (each rollback walks one further back)

# Bounded training read (solia_ai.db.read_training_features, docs/ML-MODEL.md "Bounded training
# read"): every retrain (CLI, POST /model/retrain, the background trigger), `candidate` and `train`
# run reads only this much of `features`, so memory never grows with the table. The CLIs'
# --lookback-days / --max-rows override it.
data:
  # Most recent N days, counted back from the newest row (a replay-only database works too). Must
  # cover (promotion.windows + 1) x the longest horizon (the gate's held-out windows + embargo).
  lookback_days: 2.0
  # When the window holds more rows, whole tokens are kept in md5(mint) order (deterministic, not
  # biased in time; never a partial token history) up to this many rows. Peak RSS ~ rows x size.
  max_rows: 4000000
  # At most one training window per this many seconds of a token's life (0 = one per ~10 s snapshot).
  # Consecutive snapshots are near-duplicates: thinning them shows the model more distinct
  # situations per epoch (solia_ai/dataset.py, docs/ML-MODEL.md "Overfitting: window stride").
  # Applied identically to train / validation / held-out windows; each window keeps its full history.
  window_stride_seconds: 0

# Token eligibility (solia_ai/eligibility.py, docs/ML-MODEL.md "Token eligibility"): only windows
# anchored on an eligible row are trained / validated / held out, and the bot only scores (hence
# enters) a token eligible at its latest snapshot. Causal — each criterion is a running maximum over
# the token's rows so far — and recorded with every model, so the bot reads its champion's rule.
# 0 disables a criterion (all 0 = every token); a negative threshold is rejected.
eligibility:
  min_unique_traders: 0 # most distinct traders any 5-min window has counted so far
  min_volume_sol: 0.0 # highest 5-min window SOL volume so far
  min_token_age_sec: 0.0 # token age

# Prediction horizons.
horizons: ["30s", "1m", "5m", "15m", "1h"]

# Labeling per horizon (fractional move) — see solia_ai/dataset.py for the exact rules.
# Thresholds are provisional — confirm before the first real training run (Sprint 2 decision).
labeling:
  # A horizon is only labeled if the last row inside it is within
  # max(max_gap_fraction * horizon, min_gap_seconds) of its end (no stale "realized" prices).
  max_gap_fraction: 0.25
  min_gap_seconds: 20 # two pipeline snapshot cadences
  # expected_return labels are capped here (+1000 %): a price read off a pool drained to dust can be
  # 10^8x the anchor, and one such label would dominate the regression loss. Floor is -1 (prices > 0).
  max_return: 10.0
  # Liquidity floor (SOL in the SOL-quoted pool, solia_ai/liquidity.py, docs/ML-MODEL.md
  # "Liquidity floor"): a window anchored on a pool below its venue's floor is not a sample, and a
  # price read off one counts neither towards pump nor expected_return (rug is unchanged). An AMM
  # price below ~1 SOL jumps x2 between snapshots 10-50x more often than above it; bonding curves
  # price off virtual reserves, so their small real SOL is no artifact: floor 0. Unlisted venues
  # (NULL included) take `default`. Omitted / all 0 = disabled. Recorded with every model.
  liquidity_floor:
    default: 1.0
    pumpfun: 0.0
    raydium-launchpad: 0.0
    meteora-launchpad: 0.0
    bonk: 0.0

  pump_threshold: # the highest price in the horizon rose by >= this fraction
    "30s": 0.15
    "1m": 0.25
    "5m": 0.5
    "15m": 1.0
    "1h": 2.0
  rug_threshold: # the lowest price OR liquidity in the horizon fell by >= this fraction
    "30s": 0.3
    "1m": 0.4
    "5m": 0.5
    "15m": 0.6
    "1h": 0.7
