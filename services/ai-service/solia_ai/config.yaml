# Solia AI — single source of model/training knobs (see docs/ML-MODEL.md).
# The database connection is NOT stored here; it comes from the environment
# (SOLIA_DB_CONNECTION, else POSTGRES_* — see solia_ai/config.py and .env.example).
# Override the file with SOLIA_AI_CONFIG=/path/to/config.yaml; it is validated on load.

model:
  d_model: 128
  n_heads: 8
  n_layers: 4
  ff_dim: 512 # encoder feed-forward width (4 * d_model)
  dropout: 0.1
  seq_len: 64 # longest history the model attends over (most recent rows)
  min_seq_len: 8 # shortest history a window may have: young tokens get padded, masked windows

training:
  learning_rate: 0.0003
  weight_decay: 0.01
  epochs: 50
  batch_size: 256
  warmup_steps: 500
  grad_clip: 1.0
  early_stopping_patience: 8
  seed: 42
  # Class imbalance is corrected once: balanced batches (events ~50%) by default; when false,
  # batches follow the natural distribution and the BCE term gets pos_weight = neg/pos instead.
  balanced_sampling: true

loss:
  alpha: 0.5 # pump/rug loss = alpha * BCE + (1 - alpha) * Focal(gamma)  (docs/ML-MODEL.md)
  focal_gamma: 2.0
  strategy_weight: 1.0 # weight of the pump + rug classification terms
  regression_weight: 1.0 # weight of the expected_return term (Huber)
  # Optional per-horizon weights (default 1.0 each); unlisted horizons keep 1.0.
  # horizon_weights:
  #   "1h": 1.5
  # Class weighting of the BCE term (positive class). Only with training.balanced_sampling: false
  # (balanced batches already correct the imbalance; the two are rejected together).
  #   auto            neg/pos per horizon, measured on the training split (the default then)
  #   none            no weighting
  #   3.0             one weight for both heads
  #   {pump: 5.0, rug: 2.0}   per head (an omitted head keeps 1.0)
  # pos_weight: auto

# Post-hoc probability calibration per head x horizon (solia_ai/calibration.py), fit after training
# on the earliest `fraction` of the validation windows; `evaluate` only scores windows after them.
calibration:
  method: platt # platt (temperature + bias) | temperature | none
  fraction: 0.5
  min_samples: 50 # fewer labeled samples on a head/horizon keeps the identity
  min_class_samples: 10 # ... as does a minority class (events or non-events) smaller than this

# Feature groups the model sees (solia_ai/features.py FEATURE_GROUPS); the columns of every other
# group are zeroed. Omitted = the baseline (BASELINE_GROUPS). A candidate group is enabled only once
# its ablation lift clears the margin (docs/ML-MODEL.md "Ablation"), e.g.:
# features:
#   groups: [price, liquidity, flow, holders, context, buy_pressure, momentum, concentration, burn, venue]

# Prediction horizons.
horizons: ["30s", "1m", "5m", "15m", "1h"]

# Labeling per horizon (fractional move) — see solia_ai/dataset.py for the exact rules.
# Thresholds are provisional — confirm before the first real training run (Sprint 2 decision).
labeling:
  # A horizon is only labeled if the last row inside it is within
  # max(max_gap_fraction * horizon, min_gap_seconds) of its end (no stale "realized" prices).
  max_gap_fraction: 0.25
  min_gap_seconds: 20 # two pipeline snapshot cadences

  pump_threshold: # the highest price in the horizon rose by >= this fraction
    "30s": 0.15
    "1m": 0.25
    "5m": 0.5
    "15m": 1.0
    "1h": 2.0
  rug_threshold: # the lowest price OR liquidity in the horizon fell by >= this fraction
    "30s": 0.3
    "1m": 0.4
    "5m": 0.5
    "15m": 0.6
    "1h": 0.7
