# Docker image lock: every runtime package of the ai-service image, exactly pinned (transitives
# included), resolved for Linux x86_64 / Python 3.11 with torch from the PyTorch CPU index.
# The image's dependency layer is keyed on this file only. tests/test_requirements_lock.py keeps it
# in sync with [project].dependencies. Regenerate after bumping a runtime pin (from this folder):
#   uv pip compile pyproject.toml --python-version 3.11 --python-platform x86_64-manylinux_2_28 \
#     --default-index https://pypi.org/simple --index https://download.pytorch.org/whl/cpu \
#     --index-strategy unsafe-best-match --no-annotate --no-header -o requirements.lock
